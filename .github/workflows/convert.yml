name: Convert subscriptions to Clash with SubConverter-Extended

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths-ignore:
      - '*.yaml'

# 生成的 YAML 可能包含节点地址、端口和认证信息。
# 公开仓库会公开这些内容。
permissions:
  contents: write

concurrency:
  group: convert-subscriptions
  cancel-in-progress: true

env:
  SUBCONVERTER_VERSION: 'v1.10.5'
  SUBCONVERTER_ASSET: 'SubConverter-Extended-v1.10.5-linux-amd64.tar.gz'
  SUBCONVERTER_SHA256: '9d13fc3a1d1d922627a5e80e0b600347ea701ccec302d00027ad133166b5b030'
  SUBCONVERTER_REPOSITORY: 'Aethersailor/SubConverter-Extended'
  SUBCONVERTER_PORT: '25500'
  ACL4SSR_CONFIG_URL: 'https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/575637df38884575bfa523e95c17d0ee3be1676c/Clash/config/ACL4SSR_Online.ini'

jobs:
  convert:
    name: Convert subscriptions and publish Mihomo YAML
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Discover subscription source files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_DISCOVER'
          import base64
          import os
          from pathlib import Path

          protocols = (
              'vmess://', 'vless://', 'trojan://', 'ss://', 'ssr://',
              'hysteria://', 'hysteria2://', 'hy2://', 'tuic://',
              'anytls://', 'socks://', 'socks5://', 'http://',
              'wireguard://', 'wg://',
          )

          candidates = sorted(
              path for path in Path('.').iterdir()
              if path.is_file()
              and not path.name.startswith('.')
              and path.suffix == ''
          )

          sources = []
          for path in candidates:
              try:
                  decoded = base64.b64decode(
                      path.read_bytes(), validate=True
                  ).decode('utf-8')
              except Exception:
                  continue

              lines = [line.strip() for line in decoded.splitlines() if line.strip()]
              if any(line.lower().startswith(protocols) for line in lines):
                  sources.append(path.name)

          if not sources:
              raise SystemExit('No valid subscription source files found.')

          source_value = ' '.join(sources)
          print(f'Discovered sources: {source_value}')
          print(f'Source count: {len(sources)}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'SOURCES={source_value}\n')
          PY_DISCOVER

      - name: Validate repository source files
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          protocols = (
              'vmess://',
              'vless://',
              'trojan://',
              'ss://',
              'ssr://',
              'hysteria://',
              'hysteria2://',
              'hy2://',
              'tuic://',
              'anytls://',
              'socks://',
              'socks5://',
              'http://',
              'wireguard://',
              'wg://',
          )

          for source in os.environ['SOURCES'].split():
              path = Path(source)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty repository source file: {source}')

              try:
                  decoded = base64.b64decode(path.read_bytes(), validate=True)
                  text = decoded.decode('utf-8')
              except Exception as exc:
                  raise SystemExit(f'Invalid Base64 or UTF-8 in {source}: {exc}')

              lines = [line.strip() for line in text.splitlines() if line.strip()]
              recognized = [
                  line for line in lines
                  if line.lower().startswith(protocols)
              ]

              if not lines or not recognized:
                  raise SystemExit(f'No supported proxy URI found in {source}')

              print(
                  f'OK {source}: '
                  f'decoded_lines={len(lines)}, '
                  f'recognized_uris={len(recognized)}'
              )
          PY

      - name: Download pinned SubConverter-Extended
        env:
          VERSION: ${{ env.SUBCONVERTER_VERSION }}
          ASSET: ${{ env.SUBCONVERTER_ASSET }}
          REPOSITORY: ${{ env.SUBCONVERTER_REPOSITORY }}
        run: |
          set -Eeuo pipefail

          url="https://github.com/${REPOSITORY}/releases/download/${VERSION}/${ASSET}"

          curl --fail --show-error --silent --location \
            --retry 3 \
            --retry-delay 5 \
            "$url" \
            --output subconverter-extended.tar.gz

          test -s subconverter-extended.tar.gz
          echo "${{ env.SUBCONVERTER_SHA256 }}  subconverter-extended.tar.gz" \
            | sha256sum --check --strict -

          mkdir -p subconverter-extended
          tar --extract \
            --gzip \
            --file subconverter-extended.tar.gz \
            --directory subconverter-extended

          test -x subconverter-extended/SubConverter-Extended/start.sh
          test -x subconverter-extended/SubConverter-Extended/subconverter

          # 禁止便携版自动在线升级，确保本次运行使用固定版本。
          cp subconverter-extended/SubConverter-Extended/base/pref.example.toml \
             subconverter-extended/SubConverter-Extended/base/pref.toml

          sed -i -E \
            "s/^listen = .*/listen = \"127.0.0.1\"/; \
             s/^port = .*/port = ${SUBCONVERTER_PORT}/" \
            subconverter-extended/SubConverter-Extended/base/pref.toml

          echo "SUBCONVERTER_ROOT=$GITHUB_WORKSPACE/subconverter-extended/SubConverter-Extended" \
            >> "$GITHUB_ENV"

      - name: Start local source server and SubConverter-Extended
        run: |
          set -Eeuo pipefail

          python3 -m http.server 18080 \
            --bind 127.0.0.1 \
            --directory "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/source-server.log" 2>&1 &

          source_server_pid=$!
          echo "SOURCE_SERVER_PID=$source_server_pid" >> "$GITHUB_ENV"

          SUBCONVERTER_SKIP_AUTO_UPDATE=1 \
            "$SUBCONVERTER_ROOT/start.sh" \
            > "$RUNNER_TEMP/subconverter-extended.log" 2>&1 &

          subconverter_pid=$!
          echo "SUBCONVERTER_PID=$subconverter_pid" >> "$GITHUB_ENV"

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent \
                "http://127.0.0.1:${SUBCONVERTER_PORT}/version" \
                >/dev/null 2>&1; then
              ready=true
              break
            fi

            if ! kill -0 "$subconverter_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/subconverter-extended.log" >&2 || true
              exit 1
            fi

            sleep 1
          done

          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/subconverter-extended.log" >&2 || true
            echo 'SubConverter-Extended did not become ready.' >&2
            exit 1
          fi

      - name: Convert and merge subscriptions
        env:
          ACL4SSR_CONFIG_URL: ${{ env.ACL4SSR_CONFIG_URL }}
          SUBCONVERTER_PORT: ${{ env.SUBCONVERTER_PORT }}
        run: |
          set -Eeuo pipefail

          trap '
            kill "${SUBCONVERTER_PID:-}" "${SOURCE_SERVER_PID:-}" 2>/dev/null || true
          ' EXIT

          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          api = f"http://127.0.0.1:{os.environ['SUBCONVERTER_PORT']}/sub"
          config_url = os.environ['ACL4SSR_CONFIG_URL']
          sources = os.environ['SOURCES'].split()

          # 通过 urllib 调用本机服务，避免把节点内容放入 shell 日志。
          import urllib.parse
          import urllib.request

          def request(source: str, list_only: bool) -> dict:
              params = {
                  'target': 'clash',
                  'url': f'http://127.0.0.1:18080/{source}',
                  'emoji': 'true',
                  'udp': 'true',
                  'tfo': 'true',
                  'scv': 'false',
                  'insert': 'false',
                  'config': config_url,
              }
              if list_only:
                  params['list'] = 'true'

              query = urllib.parse.urlencode(params)
              req = urllib.request.Request(f'{api}?{query}')
              with urllib.request.urlopen(req, timeout=240) as response:
                  body = response.read().decode('utf-8')

              data = yaml.safe_load(body)
              if not isinstance(data, dict):
                  raise RuntimeError(f'{source}: converter returned a non-mapping YAML')
              if body.lstrip().lower().startswith(('error', 'bad gateway')):
                  raise RuntimeError(f'{source}: converter returned an error response')
              return data

          def node_name(item):
              return item.get('name') if isinstance(item, dict) else None

          for source in sources:
              temporary = Path(f'{source}.yaml.tmp')
              try:
                  # 完整模式：取得 proxy-groups、rules、rule-providers 等规则骨架。
                  full = request(source, list_only=False)
                  # list 模式：取得可直接嵌入静态 YAML 的所有节点。
                  direct = request(source, list_only=True)

                  nodes = direct.get('proxies')
                  groups = full.get('proxy-groups')
                  rules = full.get('rules')

                  if not isinstance(nodes, list) or not nodes:
                      raise RuntimeError(f'{source}: list=true returned no proxies')
                  if not isinstance(groups, list) or not groups:
                      raise RuntimeError(f'{source}: full output returned no proxy-groups')
                  if not isinstance(rules, list) or not rules:
                      raise RuntimeError(f'{source}: full output returned no rules')

                  providers = full.pop('proxy-providers', {}) or {}
                  provider_names = set(providers) if isinstance(providers, dict) else set()
                  names = [node_name(item) for item in nodes]
                  names = [name for name in names if name]

                  # SubConverter-Extended 的完整模式通常让 proxy-groups
                  # 通过 use: [provider] 引用远程 Provider。这里把这些
                  # Provider 引用展开为 list=true 返回的静态节点名称。
                  for group in groups:
                      if not isinstance(group, dict):
                          continue

                      references = []
                      existing = group.get('proxies')
                      if isinstance(existing, list):
                          references.extend(existing)

                      uses = group.pop('use', [])
                      if isinstance(uses, list):
                          references.extend(uses)
                      elif isinstance(uses, str):
                          references.append(uses)

                      expanded = []
                      for reference in references:
                          if reference in provider_names:
                              expanded.extend(names)
                          elif reference not in expanded:
                              expanded.append(reference)

                      # Provider 组可能没有 proxies/use；这种情况下把节点
                      # 放入第一个 select 组，避免静态节点无法被选择。
                      if not expanded and group.get('type') in {
                          'select', 'url-test', 'fallback', 'load-balance'
                      }:
                          expanded = list(names)

                      if expanded:
                          group['proxies'] = list(dict.fromkeys(expanded))

                  full['proxies'] = nodes
                  full['proxy-groups'] = groups
                  full['rules'] = rules
                  full.pop('proxy-providers', None)

                  temporary.write_text(
                      yaml.safe_dump(
                          full,
                          allow_unicode=True,
                          sort_keys=False,
                          default_flow_style=False,
                      ),
                      encoding='utf-8',
                  )

                  print(
                      f'OK {source}: '
                      f'proxies={len(nodes)}, '
                      f'groups={len(groups)}, '
                      f'rules={len(rules)}'
                  )
              except Exception:
                  temporary.unlink(missing_ok=True)
                  raise

              temporary.replace(Path(f'{source}.yaml'))
          PY

      - name: Validate generated YAML and protocol preservation
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2'

          python3 - <<'PY'
          import base64
          import os
          from collections import Counter
          from pathlib import Path
          import yaml

          protocol_aliases = {
              'hy2': 'hysteria2',
              'hysteria2': 'hysteria2',
              'vless': 'vless',
              'trojan': 'trojan',
              'vmess': 'vmess',
              'ss': 'ss',
              'ssr': 'ssr',
              'tuic': 'tuic',
              'anytls': 'anytls',
          }

          failed = False

          for source in os.environ['SOURCES'].split():
              source_text = base64.b64decode(
                  Path(source).read_bytes(),
                  validate=True,
              ).decode('utf-8')

              source_types = Counter()
              for line in source_text.splitlines():
                  line = line.strip().lower()
                  if '://' not in line:
                      continue
                  scheme = line.split('://', 1)[0]
                  if scheme in protocol_aliases:
                      source_types[protocol_aliases[scheme]] += 1

              path = Path(f'{source}.yaml')
              try:
                  data = yaml.safe_load(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  print(f'ERROR {source}: invalid YAML: {exc}')
                  failed = True
                  continue

              if not isinstance(data, dict):
                  print(f'ERROR {source}: root must be a mapping')
                  failed = True
                  continue

              proxies = data.get('proxies')
              groups = data.get('proxy-groups')
              rules = data.get('rules')

              if not isinstance(proxies, list) or not proxies:
                  print(f'ERROR {source}: proxies must be a non-empty list')
                  failed = True
              if not isinstance(groups, list) or not groups:
                  print(f'ERROR {source}: proxy-groups must be a non-empty list')
                  failed = True
              if not isinstance(rules, list) or not rules:
                  print(f'ERROR {source}: rules must be a non-empty list')
                  failed = True

              actual_types = Counter()
              proxy_names = []
              for item in proxies or []:
                  if not isinstance(item, dict):
                      print(f'ERROR {source}: proxy entry is not a mapping')
                      failed = True
                      continue

                  name = item.get('name')
                  proxy_type = item.get('type')
                  proxy_names.append(name)
                  actual_types[proxy_type] += 1

                  if not name or not proxy_type:
                      print(f'ERROR {source}: proxy is missing name or type')
                      failed = True
                  if not item.get('server') or not item.get('port'):
                      print(f'ERROR {source}: proxy {name!r} lacks server/port')
                      failed = True
                  if proxy_type == 'vless' and not item.get('uuid'):
                      print(f'ERROR {source}: VLESS proxy {name!r} lacks uuid')
                      failed = True
                  if proxy_type == 'hysteria2' and not item.get('password'):
                      print(f'ERROR {source}: Hysteria2 proxy {name!r} lacks password')
                      failed = True

              duplicates = [
                  name for name, count in Counter(proxy_names).items()
                  if name and count > 1
              ]
              if duplicates:
                  print(f'ERROR {source}: duplicate proxy names: {duplicates}')
                  failed = True

              group_names = {
                  group.get('name')
                  for group in groups or []
                  if isinstance(group, dict) and group.get('name')
              }
              known = set(proxy_names) | group_names | {'DIRECT', 'REJECT'}

              missing_group_refs = set()
              for group in groups or []:
                  if not isinstance(group, dict):
                      continue
                  for reference in group.get('proxies') or []:
                      if reference not in known:
                          missing_group_refs.add(reference)
              if missing_group_refs:
                  print(f'ERROR {source}: unresolved proxy-group references')
                  failed = True

              missing_rule_targets = set()
              for rule in rules or []:
                  if not isinstance(rule, str) or len(rule.split(',')) < 2:
                      print(f'ERROR {source}: malformed rule')
                      failed = True
                      continue
                  target = rule.rsplit(',', 1)[-1].strip()
                  if target not in known and target != 'no-resolve':
                      missing_rule_targets.add(target)
              if missing_rule_targets:
                  print(f'ERROR {source}: unresolved rule targets')
                  failed = True

              # 只要求源中存在的现代协议至少保留一个，避免静默丢失。
              for proxy_type in ('vless', 'hysteria2'):
                  if source_types.get(proxy_type, 0) and not actual_types.get(proxy_type, 0):
                      print(
                          f'ERROR {source}: source contains '
                          f'{proxy_type}, but output contains none'
                      )
                      failed = True

              print(
                  f'CHECK {source}: '
                  f'source_types={dict(source_types)}, '
                  f'output_types={dict(actual_types)}, '
                  f'groups={len(groups or [])}, '
                  f'rules={len(rules or [])}'
              )

          if failed:
              raise SystemExit(1)
          PY

      - name: Commit and push validated YAML
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.yaml'

          if git diff --cached --quiet; then
            echo 'No validated YAML changes.'
            exit 0
          fi

          git commit -m 'chore: update generated Clash configs'
          git push

      - name: Remove temporary files
        if: always()
        run: |
          set +e
          kill "${SUBCONVERTER_PID:-}" "${SOURCE_SERVER_PID:-}" 2>/dev/null || true
          rm -rf \
            "$RUNNER_TEMP/subconverter-extended.log" \
            "$RUNNER_TEMP/source-server.log" \
            "$RUNNER_TEMP"/*-conversion-error \
            subconverter-extended.tar.gz \
            subconverter-extended
